<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype</title>

  <!-- MapLibre GL JS CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    .maplibregl-ctrl-bottom-right,
    .maplibregl-ctrl-attrib {
      display: none !important;
    }

    .control-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 12px;
      color: #fff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      width: 220px;
      max-height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 10px 14px;
      text-align: center;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      outline: none;
      user-select: none;
    }

    .btn-upload {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-upload:hover {
      background: #3b82f6;
      transform: translateY(-1px);
    }

    .btn-toggle {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
    }

    .btn-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    #svg-file-input {
      position: absolute;
      left: 0; top: 0;
      opacity: 0;
      width: 100%; height: 100%;
      cursor: pointer;
    }

    .legend-container {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      overflow-y: auto;
      max-height: 300px;
    }

    .legend-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      color: #e2e8f0;
    }

    .legend-color-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <div class="btn-group">
      <div class="file-input-wrapper">
        <div class="btn btn-upload">Choose SVG File</div>
        <input type="file" id="svg-file-input" accept=".svg" />
      </div>
      <button id="view-toggle-btn" class="btn btn-toggle">Switch to 3D (45°)</button>
    </div>
    
    <div id="category-legend" class="legend-container" style="display: none;">
      <div class="legend-title">Categories</div>
      <div id="legend-items"></div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    const PITCH_CENTER_LNG = -0.0005;
    const PITCH_CENTER_LAT =  0.0068;

    // Размеры футбольного поля (для расчета maxZoom)
    const PITCH_FW = 0.035;
    const PITCH_FH = 0.021;

    const COLOR_PALETTE = [
      '#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16',
      '#22c55e', '#10b981', '#14b8a6', '#06b6d4', '#0ea5e9',
      '#3b82f6', '#6366f1', '#8b5cf6', '#a855f7', '#d946ef',
      '#ec4899', '#f43f5e', '#fb7185', '#38bdf8', '#a3e635'
    ];

    let globalMinLng = Infinity, globalMinLat = Infinity;
    let globalMaxLng = -Infinity, globalMaxLat = -Infinity;
    let activeFocusedSectionId = null;
    let hoveredStateId = null;
    let isMapLoaded = false;

    function generateFootballPitchFeatures() {
      const features = [];
      const fw = PITCH_FW, fh = PITCH_FH;
      const halfW = fw / 2, halfH = fh / 2;

      function mapCoord(rx, ry) {
        return [rx + PITCH_CENTER_LNG, ry + PITCH_CENTER_LAT];
      }

      // Внешняя зона аута / забега
      const marginX = 0.0035;
      const marginY = 0.0025;
      features.push({
        "type": "Feature",
        "geometry": {
          "type": "Polygon",
          "coordinates": [[
            mapCoord(-halfW - marginX, halfH + marginY),
            mapCoord(halfW + marginX, halfH + marginY),
            mapCoord(halfW + marginX, -halfH - marginY),
            mapCoord(-halfW - marginX, -halfH - marginY),
            mapCoord(-halfW - marginX, halfH + marginY)
          ]]
        },
        "properties": { "feature_type": "pitch_grass", "color": "#15803d" }
      });

      // Игровое поле (полосы)
      const numStripes = 10;
      const stripeWidth = fw / numStripes;
      for (let i = 0; i < numStripes; i++) {
        const xLeft = -halfW + i * stripeWidth;
        const xRight = xLeft + stripeWidth;
        const color = (i % 2 === 0) ? '#16a34a' : '#15803d';
        features.push({
          "type": "Feature",
          "geometry": {
            "type": "Polygon",
            "coordinates": [[
              mapCoord(xLeft, halfH),
              mapCoord(xRight, halfH),
              mapCoord(xRight, -halfH),
              mapCoord(xLeft, -halfH),
              mapCoord(xLeft, halfH)
            ]]
          },
          "properties": { "feature_type": "pitch_grass", "color": color }
        });
      }

      function makeLine(relCoords) {
        features.push({
          "type": "Feature",
          "geometry": {
            "type": "LineString",
            "coordinates": relCoords.map(pt => mapCoord(pt[0], pt[1]))
          },
          "properties": { "feature_type": "pitch_line" }
        });
      }

      makeLine([[-halfW, halfH], [halfW, halfH], [halfW, -halfH], [-halfW, -halfH], [-halfW, halfH]]);
      makeLine([[0, halfH], [0, -halfH]]);

      const circlePts = [];
      const r = 0.0033;
      for (let a = 0; a <= 360; a += 15) {
        const rad = (a * Math.PI) / 180;
        circlePts.push([r * Math.cos(rad), r * Math.sin(rad)]);
      }
      makeLine(circlePts);

      const boxW = 0.0058, boxH = 0.0105;
      makeLine([[-halfW, boxH/2], [-halfW + boxW, boxH/2], [-halfW + boxW, -boxH/2], [-halfW, -boxH/2]]);
      makeLine([[halfW, boxH/2], [halfW - boxW, boxH/2], [halfW - boxW, -boxH/2], [halfW, -boxH/2]]);

      const sBoxW = 0.0019, sBoxH = 0.0048;
      makeLine([[-halfW, sBoxH/2], [-halfW + sBoxW, sBoxH/2], [-halfW + sBoxW, -sBoxH/2], [-halfW, -sBoxH/2]]);
      makeLine([[halfW, sBoxH/2], [halfW - sBoxW, sBoxH/2], [halfW - sBoxW, -sBoxH/2], [halfW, -sBoxH/2]]);

      function generateGoal(isLeft) {
        const goalW = 0.0025, goalD = 0.0008, goalH = 120, barThickness = 10;
        const xFront = isLeft ? -halfW : halfW;
        const xBack = isLeft ? -halfW - goalD : halfW + goalD;
        const topY = goalW / 2, bottomY = -goalW / 2;
        const postThickness = 0.0001;

        const posts = [[xFront, topY], [xFront, bottomY], [xBack, topY], [xBack, bottomY]];
        posts.forEach(([px, py]) => {
          features.push({
            "type": "Feature",
            "geometry": {
              "type": "Polygon",
              "coordinates": [[
                mapCoord(px - postThickness, py - postThickness),
                mapCoord(px + postThickness, py - postThickness),
                mapCoord(px + postThickness, py + postThickness),
                mapCoord(px - postThickness, py + postThickness),
                mapCoord(px - postThickness, py - postThickness)
              ]]
            },
            "properties": { "feature_type": "goal_3d_post", "height": goalH, "min_height": 0, "color": "#ffffff" }
          });
        });

        features.push({
          "type": "Feature",
          "geometry": {
            "type": "Polygon",
            "coordinates": [[
              mapCoord(xFront - postThickness, bottomY),
              mapCoord(xFront + postThickness, bottomY),
              mapCoord(xFront + postThickness, topY),
              mapCoord(xFront - postThickness, topY),
              mapCoord(xFront - postThickness, bottomY)
            ]]
          },
          "properties": { "feature_type": "goal_3d_post", "height": goalH + barThickness, "min_height": goalH - barThickness, "color": "#ffffff" }
        });

        [topY, bottomY].forEach(ySide => {
          features.push({
            "type": "Feature",
            "geometry": {
              "type": "Polygon",
              "coordinates": [[
                mapCoord(Math.min(xFront, xBack), ySide - postThickness),
                mapCoord(Math.max(xFront, xBack), ySide - postThickness),
                mapCoord(Math.max(xFront, xBack), ySide + postThickness),
                mapCoord(Math.min(xFront, xBack), ySide + postThickness),
                mapCoord(Math.min(xFront, xBack), ySide - postThickness)
              ]]
            },
            "properties": { "feature_type": "goal_3d_post", "height": goalH + barThickness, "min_height": goalH - barThickness, "color": "#cbd5e1" }
          });
        });

        features.push({
          "type": "Feature",
          "geometry": {
            "type": "Polygon",
            "coordinates": [[
              mapCoord(xFront, topY), mapCoord(xFront, bottomY),
              mapCoord(xBack, bottomY), mapCoord(xBack, topY),
              mapCoord(xFront, topY)
            ]]
          },
          "properties": { "feature_type": "goal_3d_net", "height": goalH, "min_height": 0 }
        });
      }

      generateGoal(true);
      generateGoal(false);
      return features;
    }

    const map = new maplibregl.Map({
      container: 'map',
      attributionControl: false,
      style: {
        version: 8,
        glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        sources: {},
        layers: [
          { 'id': 'background', 'type': 'background', 'paint': { 'background-color': '#0f172a' } }
        ]
      },
      center: [PITCH_CENTER_LNG, PITCH_CENTER_LAT],
      zoom: 12,
      pitch: 0,
      bearing: 0
    });

    map.on('load', () => {
      isMapLoaded = true;

      map.addSource('stadium-source', {
        'type': 'geojson',
        'data': {
          "type": "FeatureCollection",
          "features": []
        }
      });

      map.addLayer({
        'id': 'pitch-grass', 'type': 'fill', 'source': 'stadium-source',
        'filter': ['==', ['get', 'feature_type'], 'pitch_grass'],
        'paint': { 'fill-color': ['get', 'color'], 'fill-opacity': 1.0 }
      });

      map.addLayer({
        'id': 'pitch-lines', 'type': 'line', 'source': 'stadium-source',
        'filter': ['==', ['get', 'feature_type'], 'pitch_line'],
        'paint': { 'line-color': '#ffffff', 'line-width': 2, 'line-opacity': 0.9 }
      });

      map.addLayer({
        'id': 'sections-fill', 'type': 'fill', 'source': 'stadium-source',
        'filter': ['==', ['get', 'feature_type'], 'section'],
        'paint': {
          'fill-color': [
            'case',
            ['boolean', ['feature-state', 'hover'], false], '#ffffff',
            ['has', 'color'], ['get', 'color'],
            '#3b82f6'
          ],
          'fill-opacity': [
            'case',
            ['boolean', ['feature-state', 'hover'], false], 1.0,
            0.85
          ]
        }
      });

      map.addLayer({
        'id': 'sections-stroke', 'type': 'line', 'source': 'stadium-source',
        'filter': ['==', ['get', 'feature_type'], 'section'],
        'paint': {
          'line-color': 'rgba(0, 0, 0, 0)',
          'line-width': 0
        }
      });

      map.addLayer({
        'id': 'goal-posts-3d', 'type': 'fill-extrusion', 'source': 'stadium-source',
        'filter': ['==', ['get', 'feature_type'], 'goal_3d_post'],
        'paint': {
          'fill-extrusion-color': ['get', 'color'],
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['get', 'min_height'],
          'fill-extrusion-opacity': 1.0
        }
      });

      map.addLayer({
        'id': 'goal-net-3d', 'type': 'fill-extrusion', 'source': 'stadium-source',
        'filter': ['==', ['get', 'feature_type'], 'goal_3d_net'],
        'paint': {
          'fill-extrusion-color': '#ffffff',
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-base': ['get', 'min_height'],
          'fill-extrusion-opacity': 0.4
        }
      });

      map.addLayer({
        'id': 'sections-labels', 'type': 'symbol', 'source': 'stadium-source',
        'filter': ['==', ['get', 'feature_type'], 'label'],
        'layout': {
          'text-field': ['get', 'text'],
          'text-anchor': 'center',
          'text-justify': 'center',
          'text-allow-overlap': false,
          'text-optional': true,
          'text-padding': 2,
          'text-max-width': 6,
          'text-size': [
            'interpolate', ['linear'], ['zoom'],
            10, ['min', 14, ['*', ['get', 'bbox_height'], 350]],
            18, ['min', 22, ['*', ['get', 'bbox_height'], 89600]]
          ]
        },
        'paint': {
          'text-color': '#000000'
        }
      });

      map.on('mousemove', 'sections-fill', (e) => {
        if (e.features.length > 0) {
          const feature = e.features[0];
          if (hoveredStateId !== null && hoveredStateId !== activeFocusedSectionId) {
            map.setFeatureState({ source: 'stadium-source', id: hoveredStateId }, { hover: false });
          }
          hoveredStateId = feature.id;
          map.setFeatureState({ source: 'stadium-source', id: hoveredStateId }, { hover: true });
          map.getCanvas().style.cursor = 'pointer';
        }
      });

      map.on('mouseleave', 'sections-fill', () => {
        if (hoveredStateId !== null && hoveredStateId !== activeFocusedSectionId) {
          map.setFeatureState({ source: 'stadium-source', id: hoveredStateId }, { hover: false });
          hoveredStateId = null;
        }
        map.getCanvas().style.cursor = '';
      });

      map.on('click', 'sections-fill', (e) => {
        if (e.features.length > 0) {
          toggleSectionFocus(e.features[0]);
        }
      });
    });

    let is3D = false;
    const viewToggleBtn = document.getElementById('view-toggle-btn');

    function resetToGlobal2DView() {
      is3D = false;
      viewToggleBtn.textContent = 'Switch to 3D (45°)';

      if (isMapLoaded) {
        if (activeFocusedSectionId !== null) {
          map.setFeatureState({ source: 'stadium-source', id: activeFocusedSectionId }, { hover: false });
        }
        if (hoveredStateId !== null) {
          map.setFeatureState({ source: 'stadium-source', id: hoveredStateId }, { hover: false });
          hoveredStateId = null;
        }
      }
      activeFocusedSectionId = null;

      if (globalMinLng !== Infinity && globalMinLat !== Infinity) {
        map.fitBounds([
          [globalMinLng, globalMinLat],
          [globalMaxLng, globalMaxLat]
        ], {
          padding: { top: 60, bottom: 60, left: 260, right: 60 },
          pitch: 0,
          bearing: 0,
          duration: 1000
        });
      } else {
        map.easeTo({ pitch: 0, bearing: 0, duration: 800 });
      }
    }

    viewToggleBtn.addEventListener('click', () => {
      if (is3D) {
        resetToGlobal2DView();
      } else {
        is3D = true;
        map.easeTo({ pitch: 45, bearing: -15, duration: 800 });
        viewToggleBtn.textContent = 'Switch to 2D (Top View)';
      }
    });

    function updateZoomLimits() {
      if (globalMinLng === Infinity || globalMaxLng === -Infinity) return;

      // 1. Расчет minZoom: Весь стадион + 20% отступ
      const containerWidth = map.getContainer().clientWidth;
      const containerHeight = map.getContainer().clientHeight;
      const paddingPx = Math.min(containerWidth, containerHeight) * 0.20;

      const minCamera = map.cameraForBounds(
        [[globalMinLng, globalMinLat], [globalMaxLng, globalMaxLat]],
        { padding: paddingPx }
      );

      // 2. Расчет maxZoom: Только футбольное поле вписывается целиком
      const pitchMinLng = PITCH_CENTER_LNG - (PITCH_FW / 2);
      const pitchMaxLng = PITCH_CENTER_LNG + (PITCH_FW / 2);
      const pitchMinLat = PITCH_CENTER_LAT - (PITCH_FH / 2);
      const pitchMaxLat = PITCH_CENTER_LAT + (PITCH_FH / 2);

      const maxCamera = map.cameraForBounds(
        [[pitchMinLng, pitchMinLat], [pitchMaxLng, pitchMaxLat]],
        { padding: 20 }
      );

      if (minCamera && maxCamera) {
        map.setMinZoom(minCamera.zoom);
        map.setMaxZoom(maxCamera.zoom);
      }
    }

    function toggleSectionFocus(sectionFeature) {
      if (!sectionFeature || !sectionFeature.geometry || !sectionFeature.geometry.coordinates) return;

      if (activeFocusedSectionId === sectionFeature.id) {
        resetToGlobal2DView();
        return;
      }

      if (activeFocusedSectionId !== null) {
        map.setFeatureState({ source: 'stadium-source', id: activeFocusedSectionId }, { hover: false });
      }
      if (hoveredStateId !== null) {
        map.setFeatureState({ source: 'stadium-source', id: hoveredStateId }, { hover: false });
      }

      const coords = sectionFeature.geometry.coordinates[0];
      let sumLng = 0, sumLat = 0;

      coords.forEach(([lng, lat]) => {
        sumLng += lng;
        sumLat += lat;
      });

      const sectionCenter = [sumLng / coords.length, sumLat / coords.length];
      const dLng = PITCH_CENTER_LNG - sectionCenter[0];
      const dLat = PITCH_CENTER_LAT - sectionCenter[1];
      let bearing = Math.atan2(dLng, dLat) * (180 / Math.PI);

      is3D = true;
      viewToggleBtn.textContent = 'Switch to 2D (Top View)';

      map.easeTo({
        center: sectionCenter,
        zoom: Math.min(13.9, map.getMaxZoom()),
        pitch: 42,
        bearing: bearing,
        duration: 1000
      });

      activeFocusedSectionId = sectionFeature.id;
      hoveredStateId = sectionFeature.id;
      map.setFeatureState({ source: 'stadium-source', id: sectionFeature.id }, { hover: true });
    }

    function getCategoryFromElement(el) {
      let current = el;
      while (current && current.tagName !== 'svg') {
        if (current.hasAttribute('data-category')) {
          return current.getAttribute('data-category');
        }
        current = current.parentElement;
      }
      return null;
    }

    function renderCategoryLegend(categoryMap) {
      const legendContainer = document.getElementById('category-legend');
      const legendItemsContainer = document.getElementById('legend-items');
      
      legendItemsContainer.innerHTML = '';

      if (categoryMap.size === 0) {
        legendContainer.style.display = 'none';
        return;
      }

      categoryMap.forEach((color, categoryName) => {
        const item = document.createElement('div');
        item.className = 'legend-item';

        const swatch = document.createElement('div');
        swatch.className = 'legend-color-swatch';
        swatch.style.backgroundColor = color;

        const label = document.createElement('span');
        label.textContent = categoryName;

        item.appendChild(swatch);
        item.appendChild(label);
        legendItemsContainer.appendChild(item);
      });

      legendContainer.style.display = 'block';
    }

    document.getElementById('svg-file-input').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        convertSvgToMap(e.target.result);
      };
      reader.readAsText(file);
    });

    function convertSvgToMap(svgText) {
      if (!isMapLoaded) return;

      const parser = new DOMParser();
      const svgDoc = parser.parseFromString(svgText, "image/svg+xml");
      const svgElement = svgDoc.querySelector("svg");

      if (!svgElement) {
        alert("Invalid SVG file!");
        return;
      }

      const tempContainer = document.createElement("div");
      tempContainer.style.position = "absolute";
      tempContainer.style.visibility = "hidden";
      tempContainer.style.top = "-9999px";
      tempContainer.style.left = "-9999px";
      document.body.appendChild(tempContainer);

      const clonedSvg = svgElement.cloneNode(true);
      tempContainer.appendChild(clonedSvg);

      let svgWidth = 1000, svgHeight = 1000;
      const viewBox = svgElement.getAttribute("viewBox");
      if (viewBox) {
        const vbParts = viewBox.trim().split(/[\s,]+/).map(Number);
        if (vbParts.length === 4) {
          svgWidth = vbParts[2];
          svgHeight = vbParts[3];
        }
      } else {
        if (svgElement.getAttribute("width")) svgWidth = parseFloat(svgElement.getAttribute("width"));
        if (svgElement.getAttribute("height")) svgHeight = parseFloat(svgElement.getAttribute("height"));
      }

      const SCALE = 0.1;

      function svgToGeoCoords(x, y) {
        const lng = (x / svgWidth - 0.5) * SCALE;
        const lat = (0.5 - y / svgHeight) * SCALE;
        return [Number(lng.toFixed(6)), Number(lat.toFixed(6))];
      }

      const categoryColorMap = new Map();
      let categoryCounter = 0;

      function getCategoryColor(categoryName) {
        if (!categoryName) return '#3b82f6';
        if (!categoryColorMap.has(categoryName)) {
          const color = COLOR_PALETTE[categoryCounter % COLOR_PALETTE.length];
          categoryColorMap.set(categoryName, color);
          categoryCounter++;
        }
        return categoryColorMap.get(categoryName);
      }

      const features = generateFootballPitchFeatures();
      let featureIdCounter = 1000;

      globalMinLng = Infinity; globalMinLat = Infinity;
      globalMaxLng = -Infinity; globalMaxLat = -Infinity;

      function updateGlobalBounds(coordinates) {
        coordinates.forEach(([lng, lat]) => {
          if (lng < globalMinLng) globalMinLng = lng;
          if (lat < globalMinLat) globalMinLat = lat;
          if (lng > globalMaxLng) globalMaxLng = lng;
          if (lat > globalMaxLat) globalMaxLat = lat;
        });
      }

      function createSectionFeature(geoRing, element, defaultPrefix) {
        updateGlobalBounds(geoRing);
        const category = getCategoryFromElement(element);
        const color = getCategoryColor(category);
        const elementId = element.getAttribute("id") || `${defaultPrefix}_${featureIdCounter}`;

        const sectionFeature = {
          "type": "Feature",
          "id": featureIdCounter++,
          "geometry": { "type": "Polygon", "coordinates": [geoRing] },
          "properties": {
            "id": elementId,
            "feature_type": "section",
            "category": category || 'default',
            "color": color
          }
        };

        features.push(sectionFeature);
      }

      const paths = clonedSvg.querySelectorAll("path");
      paths.forEach(pathEl => {
        const d = pathEl.getAttribute("d");
        if (!d) return;
        const totalLength = pathEl.getTotalLength();
        if (totalLength === 0) return;

        const numSamples = Math.max(12, Math.min(100, Math.ceil(totalLength / 10)));
        const geoRing = [];

        for (let i = 0; i < numSamples; i++) {
          const point = pathEl.getPointAtLength((i / numSamples) * totalLength);
          geoRing.push(svgToGeoCoords(point.x, point.y));
        }

        if (geoRing.length >= 3) {
          geoRing.push([geoRing[0][0], geoRing[0][1]]);
          createSectionFeature(geoRing, pathEl, 'path');
        }
      });

      const polygons = clonedSvg.querySelectorAll("polygon");
      polygons.forEach(poly => {
        const pointsAttr = poly.getAttribute("points");
        if (!pointsAttr) return;

        const rawCoords = pointsAttr.trim().split(/[\s,]+/).map(Number);
        const geoRing = [];

        for (let i = 0; i < rawCoords.length - 1; i += 2) {
          const x = rawCoords[i];
          const y = rawCoords[i + 1];
          if (!isNaN(x) && !isNaN(y)) {
            geoRing.push(svgToGeoCoords(x, y));
          }
        }

        if (geoRing.length < 3) return;
        if (geoRing[0][0] !== geoRing[geoRing.length - 1][0] || geoRing[0][1] !== geoRing[geoRing.length - 1][1]) {
          geoRing.push(geoRing[0]);
        }

        createSectionFeature(geoRing, poly, 'sec');
      });

      const rects = clonedSvg.querySelectorAll("rect");
      rects.forEach(rect => {
        const x = parseFloat(rect.getAttribute("x") || 0);
        const y = parseFloat(rect.getAttribute("y") || 0);
        const w = parseFloat(rect.getAttribute("width") || 0);
        const h = parseFloat(rect.getAttribute("h") || rect.getAttribute("height") || 0);

        if (w === 0 || h === 0) return;

        const geoRing = [
          svgToGeoCoords(x, y),
          svgToGeoCoords(x + w, y),
          svgToGeoCoords(x + w, y + h),
          svgToGeoCoords(x, y + h),
          svgToGeoCoords(x, y)
        ];

        createSectionFeature(geoRing, rect, 'rect');
      });

      const texts = clonedSvg.querySelectorAll("text");
      texts.forEach(textEl => {
        const content = textEl.textContent.trim();
        if (!content) return;

        let centerX, centerY;

        try {
          const bbox = textEl.getBBox();
          centerX = bbox.x + bbox.width / 2;
          centerY = bbox.y + bbox.height / 2;
        } catch (e) {
          centerX = parseFloat(textEl.getAttribute("x") || 0);
          centerY = parseFloat(textEl.getAttribute("y") || 0);
        }

        const coords = svgToGeoCoords(centerX, centerY);

        const labelFeature = {
          "type": "Feature",
          "id": featureIdCounter++,
          "geometry": { "type": "Point", "coordinates": coords },
          "properties": {
            "text": content,
            "feature_type": "label",
            "bbox_height": 0.002
          }
        };

        features.push(labelFeature);
      });

      document.body.removeChild(tempContainer);

      renderCategoryLegend(categoryColorMap);

      map.getSource('stadium-source').setData({
        "type": "FeatureCollection",
        "features": features
      });

      updateZoomLimits();
      resetToGlobal2DView();
    }

    window.addEventListener('resize', () => {
      updateZoomLimits();
    });
  </script>
</body>
</html>
